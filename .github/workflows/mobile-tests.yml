name: Mobile Tests (Sauce Labs)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
 

jobs:
  sauce-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_ANDROID_APP: ${{ secrets.SAUCE_ANDROID_APP }}
      SAUCE_IOS_APP: ${{ secrets.SAUCE_IOS_APP }}
      SAUCE_TEST_RETRY_COUNT: ${{ github.event_name == 'schedule' && '2' || '1' }}
      # Optional device overrides if you want them fixed in CI:
      # SAUCE_ANDROID_DEVICE: "Google Pixel 7 GoogleAPI Emulator"
      # SAUCE_ANDROID_PLATFORM_VERSION: "14"
      # SAUCE_IOS_DEVICE: "iPhone 14 Simulator"
      # SAUCE_IOS_PLATFORM_VERSION: "16"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight Sauce credentials
        shell: bash
        run: |
          missing=0
          if [[ -z "${SAUCE_USERNAME}" ]]; then
            echo "::error::Missing required secret SAUCE_USERNAME"
            missing=1
          fi
          if [[ -z "${SAUCE_ACCESS_KEY}" ]]; then
            echo "::error::Missing required secret SAUCE_ACCESS_KEY"
            missing=1
          fi
          if [[ -z "${SAUCE_ANDROID_APP}" ]]; then
            echo "::warning::SAUCE_ANDROID_APP is empty; default app reference from Sauce config will be used"
          fi
          if [[ -z "${SAUCE_IOS_APP}" ]]; then
            echo "::warning::SAUCE_IOS_APP is empty; default app reference from Sauce config will be used"
          fi

          if [[ "$missing" -eq 1 ]]; then
            echo "::error::Sauce preflight failed. Add repository secrets and re-run the workflow."
            exit 1
          fi

      - name: Run Sauce Labs tests
        run: npm run test:sauce

      # Always try to generate an Allure HTML report, even if tests fail
      - name: Setup Java (for Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
